# ==========================================
# Agent1 - 化工合规 AI 平台编排
# PostgreSQL + llama.cpp(LLM+Embedding+Vision) + API + Web
# GPU：8B + VL 同卡建议 24GB 显存（3090）；Embedding 仍 CPU（-ngl 0）
# ==========================================
# 使用方式:
#   1. cp .env.example .env
#   2. 准备 models/（scripts/download-models.ps1 或 .sh）
#   3. 日常用 docker-up（按显存决定是否起 vision）:
#      Windows: powershell -File scripts/docker-up.ps1 gpu|cpu
#      Linux:   bash scripts/docker-up.sh gpu|cpu
#      裸 docker compose up -d 不启 llama-vision（profiles: [vision]）。
#      24GB 要 VL：docker-up，或 docker compose --profile vision up -d
#      点名 llama-vision 也会启动（docker-up 已点名，不必再加 --profile）。
#      CPU: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#   4. docker compose logs -f api
#   5. docker compose down
#
# 默认含 build:，会在本机编译 llama CUDA（首次 10–30 分钟）。
# 发布镜像待 GPU 最小冒烟后写入 docker-compose.release.yml
# （先复制 docker-compose.release.yml.example 并替换 <REGISTRY>）。
# 现在不要用那份 example 做 docker compose pull。
#
# 可选观测栈:
#   docker compose -f docker-compose.yml -f docker-compose.obs.yml up -d
# ==========================================

services:
  # ═══════════════════════════════════════
  # PostgreSQL 16 + pgvector 向量扩展
  # ═══════════════════════════════════════
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent1_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-chemical_park_ai_agent}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # D04/D07：与 docker-compose.demo.yml 对齐。仅空数据卷首次 init 会跑；
      # 已有 postgres_data 时需 docker compose down -v 或手动 psql 这些文件。
      - ./db/migrations/002_chemical_knowledge_graph.sql:/docker-entrypoint-initdb.d/02_graph.sql:ro
      - ./db/migrations/004_drift_anchor_baseline.sql:/docker-entrypoint-initdb.d/04_drift_anchors.sql:ro
      - ./db/migrations/005_drift_probe_tables.sql:/docker-entrypoint-initdb.d/05_drift_probe.sql:ro
      - ./db/migrations/006_drift_probe_templates.sql:/docker-entrypoint-initdb.d/06_drift_templates.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-chemical_park_ai_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent1_net

  # ═══════════════════════════════════════
  # llama.cpp LLM 推理服务 (OpenAI 兼容 :8080/v1)
  # 默认 GPU 镜像；LLM -ngl 99。Embedding 走 CPU，避免和 8B/VL 抢显存
  # ═══════════════════════════════════════
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama
    image: agent1-llama-cuda:latest
    container_name: agent1_llama
    restart: unless-stopped
    ports:
      - "${LLAMA_PORT:-8080}:8080"
    volumes:
      - ${MODELS_PATH:-./models}:/models:ro
    command:
      - "-m"
      - "/models/Qwen_Qwen3-8B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "99"
      - "-c"
      - "32768"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "-fa"
      - "-sps"
      - "0.0"
      - "--jinja"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - agent1_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ═══════════════════════════════════════
  # llama.cpp Embedding 服务 (:8081/v1)
  # 默认 -ngl 0，权重走 CPU；仍须挂 GPU，否则 CUDA 二进制缺 libcuda.so.1 → exit 127
  # ═══════════════════════════════════════
  llama-embed:
    build:
      context: .
      dockerfile: Dockerfile.llama
    image: agent1-llama-cuda:latest
    container_name: agent1_llama_embed
    restart: unless-stopped
    ports:
      - "${LLAMA_EMBED_PORT:-8081}:8081"
    volumes:
      - ${MODELS_PATH:-./models}:/models:ro
    command:
      - "-m"
      - "/models/nomic-embed-text-v1.5.f16.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "--embeddings"
      - "-ngl"
      - "0"
      - "-c"
      - "2048"
      - "--batch-size"
      - "1024"
      - "-ub"
      - "2048"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - agent1_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ═══════════════════════════════════════
  # llama.cpp 视觉 / OCR（:8083/v1，Qwen2.5-VL + mmproj）
  # 与 LLM 同卡；-c 32768 -np 4。b5512 无 --cache-ram，加上会 invalid argument 直接退出。
  # profiles: vision — 裸 up -d 不启动。docker-up 点名服务即可拉起，不必 --profile。
  # ═══════════════════════════════════════
  llama-vision:
    profiles:
      - vision
    build:
      context: .
      dockerfile: Dockerfile.llama
    image: agent1-llama-cuda:latest
    container_name: agent1_llama_vision
    restart: unless-stopped
    ports:
      - "${LLAMA_VISION_PORT:-8083}:8083"
    volumes:
      - ${MODELS_PATH:-./models}:/models:ro
    command:
      - "-m"
      - "/models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf"
      - "--mmproj"
      - "/models/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8083"
      - "-ngl"
      - "99"
      - "-c"
      - "32768"
      - "-np"
      - "4"
      - "--jinja"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - agent1_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ═══════════════════════════════════════
  # Agent1 API 服务
  # ═══════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent1_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8088,http://localhost:3000,http://localhost:5173}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-chemical_park_ai_agent}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
      - JWT_KEY=${JWT_KEY:?生产环境必须设置 JWT_KEY}
      - 'AUTH_ACCOUNTS_JSON=${AUTH_ACCOUNTS_JSON:-[]}'
      - LLM_ENDPOINT=http://llama-server:8080/v1
      - VectorSearch__EmbeddingEndpoint=http://llama-embed:8081/v1
      - MULTIMODAL_ENDPOINT=http://llama-vision:8083/v1
      - ENABLE_VISION_OCR=${ENABLE_VISION_OCR:-false}
      - KNOWLEDGE_BASE_PATH=/app/knowledgebase
      - DATA_PROTECTION_KEYS_PATH=/app/dataprotection-keys
      - ALERT_EMAIL_PASSWORD=${ALERT_EMAIL_PASSWORD:-}
      - ALERT_RECIPIENT_EMAILS=${ALERT_RECIPIENT_EMAILS:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
    volumes:
      - api_logs:/app/logs
      - api_dataprotection:/app/dataprotection-keys
      # 宿主机路径来自 .env 的 KNOWLEDGE_BASE_PATH（默认 ./knowledgebase）；容器内进程仍用下面的 /app/knowledgebase
      - ${KNOWLEDGE_BASE_PATH:-./knowledgebase}:/app/knowledgebase
    depends_on:
      postgres:
        condition: service_healthy
      llama-server:
        condition: service_started
      llama-embed:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - agent1_net

  # ═══════════════════════════════════════
  # Agent1 Web 前端 (Nginx SPA + 同域反向代理)
  # ═══════════════════════════════════════
  web:
    build:
      context: ./agent1-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    image: agent1-web:latest
    container_name: agent1_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agent1_net

volumes:
  postgres_data:
    name: agent1_postgres_data
  api_logs:
    name: agent1_api_logs
  api_dataprotection:
    name: agent1_api_dataprotection

networks:
  agent1_net:
    name: agent1_net
    driver: bridge
