# Agent1 Web — SPA + 同域反向代理到 api:8080
# /health 必须转给后端 JSON，容器探活用 /nginx-health
# 用变量 + Docker DNS，避免 api 未就绪时 Nginx 拒绝启动

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # 映射端口 8088→80 时，禁止把目录 301 写成 http://localhost/assets/（丢掉 8088）
    absolute_redirect off;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Vite hashed 静态资源；不要用前缀 /assets/，否则会挡住 Vue 路由 /assets
    location ~* ^/assets/.+\.(js|css|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^/(api|health|cache|metrics|memory)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vue 路由 /knowledgebase 走 SPA；后端 /knowledgebase/* 再代理
    location = /knowledgebase {
        try_files $uri /index.html;
    }

    location /knowledgebase/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        # 不要 $uri/：dist/assets 是真实目录，会 301/403，冲掉 SPA /assets
        try_files $uri /index.html;
    }
}
